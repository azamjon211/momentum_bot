<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bugungi tasklar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
  }
  h1 {
    font-size: 18px;
    margin-bottom: 16px;
  }
  .task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f7);
  }
  .task.done {
    opacity: 0.5;
    text-decoration: line-through;
  }
  .task button {
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    font-size: 14px;
  }
  .empty, .error {
    text-align: center;
    opacity: 0.6;
    margin-top: 40px;
  }
</style>
</head>
<body>
<h1>Bugungi tasklaringiz</h1>
<div id="list">Yuklanmoqda...</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const initData = tg.initData;
  const listEl = document.getElementById('list');

  async function loadTasks() {
    try {
      const res = await fetch('/api/telegram/miniapp/tasks/today', {
        headers: { 'X-Telegram-Init-Data': initData },
      });
      if (!res.ok) throw new Error('Xatolik: ' + res.status);
      const data = await res.json();
      render(data.tasks);
    } catch (e) {
      listEl.innerHTML = '<div class="error">Yuklab bo\'lmadi: ' + e.message + '</div>';
    }
  }

  function render(tasks) {
    if (!tasks.length) {
      listEl.innerHTML = '<div class="empty">Bugun uchun task yo\'q</div>';
      return;
    }
    listEl.innerHTML = '';
    tasks.forEach(task => {
      const row = document.createElement('div');
      row.className = 'task' + (task.is_done ? ' done' : '');
      row.innerHTML = '<span>' + task.title + '</span>';

      if (!task.is_done) {
        const btn = document.createElement('button');
        btn.textContent = 'Bajardim';
        btn.onclick = () => completeTask(task.id, row);
        row.appendChild(btn);
      }
      listEl.appendChild(row);
    });
  }

  async function completeTask(taskId, row) {
    try {
      const res = await fetch('/api/telegram/miniapp/tasks/' + taskId + '/complete', {
        method: 'PATCH',
        headers: { 'X-Telegram-Init-Data': initData },
      });
      if (!res.ok) throw new Error('Xatolik: ' + res.status);
      row.classList.add('done');
      row.querySelector('button')?.remove();
      tg.HapticFeedback.notificationOccurred('success');
    } catch (e) {
      alert('Bajarib bo\'lmadi: ' + e.message);
    }
  }

  loadTasks();
</script>
</body>
</html>
